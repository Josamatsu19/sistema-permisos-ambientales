<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Usuario | Sistema de Permisos Ambientales</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Registro de Usuario</h1>
        <p class="subtitle">Ventanilla Única Ambiental - Ley 41 de 1998</p>

        <div id="alertaRegistro" class="alert"></div>

        <form id="formRegistro">
          <div class="form-group">
            <label for="nombre">Nombre Completo o Razón Social</label>
            <input
              type="text"
              id="nombre"
              class="form-control"
              placeholder="Ej. Ing. Carlos Mendoza"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="correo@empresa.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña (mínimo 6 caracteres)</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="rol">Rol en el Sistema</label>
            <select id="rol" class="form-control">
              <option value="solicitante">
                Solicitante / Promotor de Proyecto
              </option>
              <option value="evaluador">Evaluador Técnico (MiAmbiente)</option>
              <option value="admin">Administrador del Sistema</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Completar Registro
          </button>
        </form>

        <p style="margin-top: 1.25rem; text-align: center; font-size: 0.9rem">
          ¿Ya tiene una cuenta?
          <a
            href="login.html"
            style="color: var(--primary-light); font-weight: 600"
            >Iniciar Sesión</a
          >
        </p>
      </div>
    </div>
    <script src="js/registro.js"></script>
  </body>
</html>
