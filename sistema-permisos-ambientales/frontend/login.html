<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Sistema de Permisos Ambientales - MiAmbiente</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>MiAmbiente Digital</h1>
        <p class="subtitle">
          Sistema de Evaluación y Permisos Ambientales (Ley 41 de 1998)
        </p>

        <div id="alertaLogin" class="alert"></div>

        <form id="formLogin">
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="usuario@ejemplo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Iniciar Sesión
          </button>
        </form>

        <p style="margin-top: 1.25rem; text-align: center; font-size: 0.9rem">
          ¿No tiene cuenta registrada?
          <a
            href="registro.html"
            style="color: var(--primary-light); font-weight: 600"
            >Crear cuenta</a
          >
        </p>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
